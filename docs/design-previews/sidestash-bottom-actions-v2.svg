  <g transform="translate(376 154)" filter="url(#folderShadow)">
    <path d="M2 12c0-4.4 3.6-8 8-8h27l8 7h55c4.4 0 8 3.6 8 8v54c0 4.4-3.6 8-8 8H10c-4.4 0-8-3.6-8-8Z" fill="url(#folderBlue)"/>
    <path d="M7 22h96" stroke="#c7f1ff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>
  <text x="430" y="260" text-anchor="middle" class="rowText">Screenshots</text>

  <g transform="translate(236 292)">
