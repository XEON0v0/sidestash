    <linearGradient id="toolbar" x1="0" y1="0" x2="0" y2="36">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#f6f6f7" stop-opacity="0.48"/>
    </linearGradient>
    <style>
      .title { font: 650 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: rgba(28,28,30,.88); }
      .rowText { font: 520 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: rgba(34,34,36,.76); }
      .note { font: 500 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: rgba(28,28,30,.62); }
      .icon { fill: none; stroke: rgba(67,67,70,.86); stroke-width: 2.15; stroke-linecap: round; stroke-linejoin: round; }
      .iconSoft { fill: none; stroke: rgba(67,67,70,.38); stroke-width: 2.15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="720" height="620" fill="url(#stage)"/>
  <rect width="720" height="620" fill="url(#light)"/>

  <g filter="url(#panelShadow)">
    <rect x="200" y="76" width="320" height="420" rx="20" fill="#f7f8fa" fill-opacity="0.94"/>
    <rect x="200.5" y="76.5" width="319" height="419" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.72"/>
    <rect x="200.5" y="76.5" width="319" height="419" rx="19.5" fill="none" stroke="#000000" stroke-opacity="0.045"/>
