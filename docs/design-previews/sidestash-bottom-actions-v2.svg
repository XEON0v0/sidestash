<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620">
  <defs>
    <linearGradient id="stage" x1="110" y1="70" x2="620" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="0.48" stop-color="#b2b9c3"/>
      <stop offset="1" stop-color="#e5e8ed"/>
    </linearGradient>
    <radialGradient id="light" cx="190" cy="108" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="150" y="70" width="420" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#202226" flood-opacity="0.25"/>
    </filter>
    <filter id="finderFloat" x="180" y="70" width="360" height="460" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.085"/>
    </filter>
    <filter id="folderShadow" x="-20" y="-12" width="150" height="130" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="folderBlue" x1="0" y1="0" x2="0" y2="56">
      <stop offset="0" stop-color="#61c9f1"/>
      <stop offset="1" stop-color="#38a9dc"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="28">
