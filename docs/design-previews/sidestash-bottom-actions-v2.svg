    <rect x="212.6" y="86.6" width="294.8" height="36.8" rx="18.4" fill="none" stroke="#ffffff" stroke-opacity="0.76"/>
    <rect x="213" y="87" width="294" height="36" rx="18" fill="none" stroke="#000000" stroke-opacity="0.035"/>
